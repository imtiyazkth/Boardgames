name: Build & Deploy
on:
  push:
    branches: [main]
permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  deploy-web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build
      - uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          force_orphan: true
          enable_jekyll: false

  build-apk:
    runs-on: ubuntu-latest
    needs: deploy-web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci && npm run build
      - name: Install Capacitor pinned
        run: npm install @capacitor/core@6.1.2 @capacitor/cli@6.1.2 @capacitor/android@6.1.2
      - run: npx cap add android || true
      - run: npx cap sync android
      - name: Fix Kotlin stdlib conflict
        run: |
          cat >> android/build.gradle << 'GRADLE'
          subprojects {
            configurations.all {
              resolutionStrategy {
                force "org.jetbrains.kotlin:kotlin-stdlib:1.9.10"
                force "org.jetbrains.kotlin:kotlin-stdlib-jdk7:1.9.10"
                force "org.jetbrains.kotlin:kotlin-stdlib-jdk8:1.9.10"
              }
            }
          }
          GRADLE
      - uses: android-actions/setup-android@v3
      - run: yes | sdkmanager --licenses || true
      - name: Build APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon -Dorg.gradle.jvmargs="-Xmx2g"
      - uses: actions/upload-artifact@v4
        with:
          name: BoardGames-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
